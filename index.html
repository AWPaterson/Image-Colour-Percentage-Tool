<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Color Percentage Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Image Color Percentage Calculator</h1>
        <p class="subtitle">Upload an image to analyze the percentage of each color present</p>

        <div class="upload-section">
            <input type="file" id="imageInput" accept="image/*" />
            <label for="imageInput" class="upload-label">
                <span class="upload-icon">📁</span>
                <span>Choose an image</span>
            </label>
        </div>

        <div id="imagePreview" class="image-preview hidden">
            <h2>Uploaded Image</h2>
            <canvas id="canvas"></canvas>
        </div>

        <div id="results" class="results hidden">
            <h2>Color Analysis Results</h2>
            <div class="controls">
                <label for="colorLimit">Number of colors to display:</label>
                <input type="number" id="colorLimit" min="1" max="100" value="10">
                <button id="updateResults">Update</button>
            </div>
            <div id="colorList" class="color-list"></div>
            <div class="stats">
                <p>Total pixels analyzed: <span id="totalPixels">0</span></p>
                <p>Unique colors found: <span id="uniqueColors">0</span></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
